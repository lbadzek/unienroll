spring.application.name=unienroll

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/unienroll
spring.datasource.username=${DB_USERNAME:unienroll}
spring.datasource.password=${DB_PASSWORD:unienroll123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway database migrations
spring.flyway.enabled=true

# Server
server.port=8080
