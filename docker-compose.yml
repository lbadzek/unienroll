
services:
  postgres:
    image: postgres:17
    container_name: unienroll-postgres
    environment:
      POSTGRES_DB: unienroll
      POSTGRES_USER: unienroll
      POSTGRES_PASSWORD: ${DB_PASSWORD:-unienroll123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unienroll -d unienroll"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
